<!--
  Product grid sections (flash sale + 6 category blocks).
  Content is injected at runtime by js/components/product-section.js (renderProductSection /
  mountProductSections), reading data from js/data/products.js (PRODUCT_SECTIONS).
  Orchestrator: include the following before </body> in index.html —
    <script src="js/data/products.js" defer></script>
    <script src="js/components/product-section.js" defer></script>
  product-section.js also auto-mounts on DOMContentLoaded by querying for .product-sections,
  so this fragment is self-sufficient when opened/tested standalone.
-->
<main class="product-sections" aria-label="Danh sách sản phẩm"></main>
