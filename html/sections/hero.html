<section class="hero" aria-label="Banner khuyến mãi">
  <div class="hero__slider" id="js-hero-slider">
    <div class="hero__track" id="js-hero-track">
      <a class="hero__slide" href="#" aria-label="Xem khuyến mãi 1">
        <img src="assets/images/hero-slide-1.png" alt="Khuyến mãi giảm giá khoá cửa và thiết bị thông minh" loading="eager">
      </a>
      <a class="hero__slide" href="#" aria-label="Xem khuyến mãi khoá cửa vân tay">
        <img src="assets/images/hero-slide-2.jpg" alt="Khuyến mãi khoá cửa vân tay" loading="lazy">
      </a>
      <a class="hero__slide" href="#" aria-label="Xem khuyến mãi 3">
        <img src="assets/images/hero-slide-3.png" alt="Khuyến mãi camera giám sát và wifi mesh" loading="lazy">
      </a>
      <a class="hero__slide" href="#" aria-label="Xem khuyến mãi 4">
        <img src="assets/images/hero-slide-4.png" alt="Khuyến mãi thiết bị mạng và khoá thông minh" loading="lazy">
      </a>
    </div>

    <button type="button" class="hero__arrow hero__arrow--prev" id="js-hero-prev" aria-label="Slide trước">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button type="button" class="hero__arrow hero__arrow--next" id="js-hero-next" aria-label="Slide tiếp theo">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="hero__dots" id="js-hero-dots" role="tablist" aria-label="Chọn slide">
      <button type="button" class="hero__dot is-active" role="tab" aria-selected="true" aria-label="Slide 1" data-index="0"></button>
      <button type="button" class="hero__dot" role="tab" aria-selected="false" aria-label="Slide 2" data-index="1"></button>
      <button type="button" class="hero__dot" role="tab" aria-selected="false" aria-label="Slide 3" data-index="2"></button>
      <button type="button" class="hero__dot" role="tab" aria-selected="false" aria-label="Slide 4" data-index="3"></button>
    </div>
  </div>
</section>
